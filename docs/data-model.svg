<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">SkillBridge graph data model</title>
  <desc id="desc">Roles require skills. People have skills and build projects. Courses teach skills. Projects are built with skills.</desc>
  <defs>
    <style>
      text { font-family: Inter, Arial, sans-serif; fill: #182026; }
      .node { stroke: #26323c; stroke-width: 2; }
      .label { font-size: 21px; font-weight: 800; }
      .props { font-size: 14px; fill: #5d6975; }
      .edge { stroke: #81909b; stroke-width: 2; marker-end: url(#arrow); }
      .edge-label { font-size: 14px; font-weight: 800; fill: #394650; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#81909b" />
    </marker>
  </defs>

  <rect width="980" height="520" rx="0" fill="#f4f7f5" />

  <line class="edge" x1="258" y1="130" x2="430" y2="230" />
  <text class="edge-label" x="305" y="162">REQUIRES</text>

  <line class="edge" x1="725" y1="105" x2="560" y2="220" />
  <text class="edge-label" x="620" y="145">TEACHES</text>

  <line class="edge" x1="720" y1="395" x2="558" y2="300" />
  <text class="edge-label" x="608" y="372">BUILT_WITH</text>

  <line class="edge" x1="260" y1="390" x2="430" y2="300" />
  <text class="edge-label" x="298" y="372">HAS_SKILL</text>

  <line class="edge" x1="300" y1="430" x2="665" y2="430" />
  <text class="edge-label" x="448" y="418">BUILT</text>

  <rect class="node" x="70" y="70" width="210" height="95" rx="8" fill="#dfeee9" />
  <text class="label" x="100" y="110">Role</text>
  <text class="props" x="100" y="138">id, title, domain, seniority</text>

  <rect class="node" x="395" y="220" width="190" height="100" rx="8" fill="#dce9f7" />
  <text class="label" x="435" y="260">Skill</text>
  <text class="props" x="435" y="288">id, name, category</text>

  <rect class="node" x="705" y="55" width="215" height="100" rx="8" fill="#f4e6c9" />
  <text class="label" x="745" y="95">Course</text>
  <text class="props" x="745" y="123">id, title, provider, hours</text>

  <rect class="node" x="70" y="340" width="215" height="105" rx="8" fill="#f2dbe2" />
  <text class="label" x="105" y="382">Person</text>
  <text class="props" x="105" y="410">id, name, location, headline</text>

  <rect class="node" x="690" y="340" width="220" height="105" rx="8" fill="#d8eff0" />
  <text class="label" x="728" y="382">Project</text>
  <text class="props" x="728" y="410">id, name, outcome</text>
</svg>
